<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 400"
  fill="none"
  width="400"
  height="400"
>
  <defs>
    <!-- Glow filters -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Glitch displacement -->
    <filter id="glitch">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <!-- Gradient definitions -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-grad-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <!-- Scanlines pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.02)" />
      <rect y="2" width="4" height="2" fill="transparent" />
    </pattern>
    <!-- Hex grid pattern -->
    <pattern id="hex-grid" width="24" height="42" patternUnits="userSpaceOnUse">
      <path d="M12 0l12 7v14l-12 7-12-7V7z" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="0.5" />
      <path d="M12 42l12-7V21l-12 7-12-7v14z" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="0.5" />
      <path d="M24 14l12 7v14l-12 7" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="0.5" />
      <path d="M0 28l12 7v14l-12 7" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="0.5" />
      <path d="M-12 28l12 7v14l-12 7" fill="none" stroke="rgba(59,130,246,0.04)" stroke-width="0.5" />
    </pattern>
    <!-- Clip path for content inside the circle -->
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="180" />
    </clipPath>
  </defs>

  <!-- BG Circle (dark) -->
  <circle cx="200" cy="200" r="180" fill="url(#dark-grad)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Hex grid inside circle -->
  <circle cx="200" cy="200" r="180" fill="url(#hex-grid)" />

  <!-- Scanlines overlay -->
  <circle cx="200" cy="200" r="180" fill="url(#scanlines)" />

  <!-- Outer glow ring -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="2" filter="url(#glow-soft)" />

  <!-- Inner accent ring - bottom arc -->
  <path
    d="M 60 260 A 160 160 0 0 0 340 260"
    fill="none"
    stroke="url(#accent-grad-h)"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.6"
    filter="url(#glow-subtle)"
  />

  <!-- ===== HOODIE FIGURE SILHOUETTE ===== -->
  <g clip-path="url(#circle-clip)">
    <!-- Hood - main shape -->
    <path
      d="M 115 155
         C 115 100, 140 65, 200 60
         C 260 65, 285 100, 285 155
         C 285 210, 310 245, 320 280
         L 340 340
         L 60 340
         L 80 280
         C 90 245, 115 210, 115 155 Z"
      fill="rgba(255,255,255,0.03)"
      stroke="rgba(255,255,255,0.1)"
      stroke-width="1"
    />

    <!-- Hoodie collar lines - left -->
    <path
      d="M 115 155 C 140 175, 175 200, 200 215"
      fill="none"
      stroke="rgba(59,130,246,0.25)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <!-- Hoodie collar lines - right -->
    <path
      d="M 285 155 C 260 175, 225 200, 200 215"
      fill="none"
      stroke="rgba(59,130,246,0.25)"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- Hoodie drawstrings -->
    <line x1="175" y1="200" x2="160" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <line x1="225" y1="200" x2="240" y2="310" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- ===== FACE AREA - CYBER/DIGITAL MASK ===== -->

    <!-- Face outline - polygon mesh style -->
    <path
      d="M 170 130
         L 190 110
         L 210 110
         L 230 130
         L 235 150
         L 230 165
         L 210 175
         L 190 175
         L 170 165
         L 165 150 Z"
      fill="rgba(59,130,246,0.04)"
      stroke="rgba(59,130,246,0.3)"
      stroke-width="1"
    />

    <!-- Eyes - horizontal slits (cyber visor style) -->
    <line x1="178" y1="140" x2="195" y2="140" stroke="url(#accent-grad-h)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-soft)" />
    <line x1="205" y1="140" x2="222" y2="140" stroke="url(#accent-grad-h)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-soft)" />

    <!-- Face center line (digital nose bridge) -->
    <line x1="200" y1="130" x2="200" y2="162" stroke="rgba(59,130,246,0.2)" stroke-width="0.8" />

    <!-- Mouth - digital glitch bar -->
    <rect x="185" y="158" width="30" height="3" rx="1.5" fill="url(#accent-grad-h)" opacity="0.5" filter="url(#glow-subtle)" />
    <rect x="192" y="158" width="8" height="3" rx="1.5" fill="#fff" opacity="0.3" />

    <!-- ===== CIRCUIT LINES AROUND COLLAR ===== -->
    <!-- Left circuit traces -->
    <path
      d="M 130 170 L 145 170 L 150 175 L 150 185 L 140 185 L 140 195"
      fill="none"
      stroke="rgba(59,130,246,0.2)"
      stroke-width="1"
      stroke-linecap="square"
    />
    <circle cx="140" cy="195" r="2" fill="rgba(59,130,246,0.3)" />

    <path
      d="M 135 178 L 130 178 L 128 180"
      fill="none"
      stroke="rgba(139,92,246,0.15)"
      stroke-width="0.8"
      stroke-linecap="square"
    />

    <!-- Right circuit traces -->
    <path
      d="M 270 170 L 255 170 L 250 175 L 250 185 L 260 185 L 260 195"
      fill="none"
      stroke="rgba(59,130,246,0.2)"
      stroke-width="1"
      stroke-linecap="square"
    />
    <circle cx="260" cy="195" r="2" fill="rgba(59,130,246,0.3)" />

    <path
      d="M 265 178 L 270 178 L 272 180"
      fill="none"
      stroke="rgba(139,92,246,0.15)"
      stroke-width="0.8"
      stroke-linecap="square"
    />

    <!-- ===== GLITCH BARS (random rectangles) ===== -->
    <rect x="165" y="145" width="6" height="1.5" rx="0.5" fill="rgba(59,130,246,0.3)" />
    <rect x="228" y="148" width="4" height="1.5" rx="0.5" fill="rgba(139,92,246,0.3)" />
    <rect x="195" y="132" width="10" height="1" rx="0.5" fill="rgba(59,130,246,0.2)" />
    <rect x="172" y="168" width="14" height="1" rx="0.5" fill="rgba(139,92,246,0.15)" />

    <!-- ===== DECORATIVE HEXAGONS ===== -->
    <!-- Top-left small hex -->
    <path
      d="M 130 100 l 6 -3.5 l 6 3.5 l 0 7 l -6 3.5 l -6 -3.5 Z"
      fill="none"
      stroke="rgba(59,130,246,0.15)"
      stroke-width="0.8"
    />
    <!-- Top-right small hex -->
    <path
      d="M 258 95 l 6 -3.5 l 6 3.5 l 0 7 l -6 3.5 l -6 -3.5 Z"
      fill="none"
      stroke="rgba(139,92,246,0.15)"
      stroke-width="0.8"
    />

    <!-- ===== BINARY / CODE RAIN BACKGROUND ===== -->
    <text x="125" y="250" font-family="monospace" font-size="8" fill="rgba(59,130,246,0.08)" transform="rotate(-12, 125, 250)">011010</text>
    <text x="260" y="270" font-family="monospace" font-size="8" fill="rgba(139,92,246,0.08)" transform="rotate(8, 260, 270)">101101</text>
    <text x="140" y="290" font-family="monospace" font-size="7" fill="rgba(59,130,246,0.06)" transform="rotate(-5, 140, 290)">010</text>
    <text x="250" y="300" font-family="monospace" font-size="7" fill="rgba(59,130,246,0.06)" transform="rotate(5, 250, 300)">110</text>

    <!-- ===== CROSSHAIR / TARGET RETICLE (cybersecurity vibe) ===== -->
    <g opacity="0.08" transform="translate(115, 310)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#3b82f6" stroke-width="0.8" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#3b82f6" stroke-width="0.6" />
      <circle cx="0" cy="0" r="2" fill="#3b82f6" opacity="0.3" />
      <line x1="-14" y1="0" x2="-10" y2="0" stroke="#3b82f6" stroke-width="0.5" />
      <line x1="10" y1="0" x2="14" y2="0" stroke="#3b82f6" stroke-width="0.5" />
      <line x1="0" y1="-14" x2="0" y2="-10" stroke="#3b82f6" stroke-width="0.5" />
      <line x1="0" y1="10" x2="0" y2="14" stroke="#3b82f6" stroke-width="0.5" />
    </g>

    <g opacity="0.08" transform="translate(285, 305)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#8b5cf6" stroke-width="0.8" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#8b5cf6" stroke-width="0.6" />
      <circle cx="0" cy="0" r="2" fill="#8b5cf6" opacity="0.3" />
      <line x1="-14" y1="0" x2="-10" y2="0" stroke="#8b5cf6" stroke-width="0.5" />
      <line x1="10" y1="0" x2="14" y2="0" stroke="#8b5cf6" stroke-width="0.5" />
      <line x1="0" y1="-14" x2="0" y2="-10" stroke="#8b5cf6" stroke-width="0.5" />
      <line x1="0" y1="10" x2="0" y2="14" stroke="#8b5cf6" stroke-width="0.5" />
    </g>
  </g>

  <!-- ===== OUTER DECORATIVE ELEMENTS ===== -->
  <!-- Corner accent lines -->
  <line x1="20" y1="40" x2="50" y2="40" stroke="rgba(59,130,246,0.12)" stroke-width="1" stroke-linecap="round" />
  <line x1="20" y1="40" x2="20" y2="70" stroke="rgba(59,130,246,0.12)" stroke-width="1" stroke-linecap="round" />

  <line x1="380" y1="40" x2="350" y2="40" stroke="rgba(59,130,246,0.12)" stroke-width="1" stroke-linecap="round" />
  <line x1="380" y1="40" x2="380" y2="70" stroke="rgba(59,130,246,0.12)" stroke-width="1" stroke-linecap="round" />

  <line x1="20" y1="360" x2="50" y2="360" stroke="rgba(139,92,246,0.08)" stroke-width="1" stroke-linecap="round" />
  <line x1="20" y1="360" x2="20" y2="330" stroke="rgba(139,92,246,0.08)" stroke-width="1" stroke-linecap="round" />

  <line x1="380" y1="360" x2="350" y2="360" stroke="rgba(139,92,246,0.08)" stroke-width="1" stroke-linecap="round" />
  <line x1="380" y1="360" x2="380" y2="330" stroke="rgba(139,92,246,0.08)" stroke-width="1" stroke-linecap="round" />

  <!-- Outer rotating accent dots -->
  <circle cx="200" cy="18" r="2" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="0.8" />
  <circle cx="370" cy="200" r="2" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="0.8" />
  <circle cx="200" cy="382" r="2" fill="none" stroke="rgba(59,130,246,0.12)" stroke-width="0.8" />
  <circle cx="30" cy="200" r="2" fill="none" stroke="rgba(139,92,246,0.15)" stroke-width="0.8" />
</svg>
